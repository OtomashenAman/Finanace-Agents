# Alert rules for FinanceACC (load with the Prometheus config above).
groups:
  - name: finance-acc
    rules:
      - alert: FinanceAccDown
        expr: up{job="finance-acc"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: FinanceACC API is not answering scrapes

      - alert: FinanceAccHighErrorRate
        expr: |
          sum(rate(finance_acc_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(finance_acc_http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: More than 5% of API requests fail with a server error

      - alert: FinanceAccSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(finance_acc_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 95% of API requests take longer than 2 seconds

      - alert: FinanceAccJobsFailed
        expr: finance_acc_jobs{status="failed"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Background jobs gave up. Retry them under Admin Settings → Monitoring

      - alert: FinanceAccQueueBacklog
        expr: finance_acc_jobs_oldest_queued_seconds > 300
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Jobs have waited over 5 minutes. Is the worker running?

      - alert: FinanceAccLlmFailing
        expr: |
          finance_acc_llm_calls_24h{status="failed"}
            / clamp_min(sum(finance_acc_llm_calls_24h), 1) > 0.2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Over 20% of AI explanation calls failed in the last 24 hours

      - alert: FinanceAccApprovalsOverdue
        expr: finance_acc_runs_overdue_approval > 0
        for: 1h
        labels: {severity: info}
        annotations:
          summary: Runs have waited for approval longer than the review SLA

      - alert: FinanceAccDataSourcesNeedReauth
        expr: finance_acc_data_sources{status=~"needs_reauth|error"} > 0
        for: 1h
        labels: {severity: info}
        annotations:
          summary: Users' QuickBooks connections need re-authorization or failed to sync

      - alert: FinanceAccAuditSeqWentBack
        expr: finance_acc_audit_events_last_seq < max_over_time(finance_acc_audit_events_last_seq[1d])
        labels: {severity: critical}
        annotations:
          summary: The newest audit event sequence decreased. Run `python -m src.app.cli.audit verify`
