# Local ERPNext for the Finance POD (development and demo only, never production).
#
#   uv run poe erpnext-up      # first start creates the site (a few minutes)
#   open http://localhost:8090 # Administrator / $ERPNEXT_ADMIN_PASSWORD (default "admin")
#   uv run poe erpnext-down    # stop (data kept); erpnext-reset wipes it
#
# Based on frappe_docker's pwd.yml (one worker instead of two, to fit a 4 GB Docker VM).
# Its own compose project ("erpnext") and network: nothing is shared with the app's stack.
# The app reaches it at http://host.docker.internal:8090 (or http://localhost:8090 outside
# Docker) with an API key/secret made by `uv run poe erpnext-seed`.

x-erpnext: &erpnext
  image: frappe/erpnext:v16.53.0
  networks: [erpnext]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

services:
  configurator:
    <<: *erpnext
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"

  create-site:
    <<: *erpnext
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 180 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 180 )); then echo "common_site_config.json not ready"; exit 1; fi
        done;
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --set-default frontend;
        fi;
    environment:
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    networks: [erpnext]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
      - --innodb-buffer-pool-size=256M
    environment:
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql

  backend:
    <<: *erpnext
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *erpnext
    restart: unless-stopped
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${ERPNEXT_PORT:-8090}:8080"
    depends_on: [backend, websocket]

  queue:
    <<: *erpnext
    restart: unless-stopped
    command: [bench, worker, --queue, "long,default,short"]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *erpnext
    restart: unless-stopped
    command: [bench, schedule]
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: *erpnext
    restart: unless-stopped
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks: [erpnext]
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks: [erpnext]
    restart: unless-stopped

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  erpnext:
