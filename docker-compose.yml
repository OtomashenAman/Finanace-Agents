# Development stack: Postgres/pgvector + FastAPI (hot reload) + Vite (HMR), and the local
# ERPNext (ops/erpnext) with its demo company, all seeded on the first `up`:
#   uv run poe docker-up   (or: docker compose up --build)
#   uv run poe db-up       (only the database; run backend/frontend locally)
# A fresh machine gets the Finance Admin and the Finance POD team (migrate), then ERPNext's
# demo company and the app's connection to it with a first snapshot (erpnext-seed, once the
# new ERPNext site is up: allow ~10 minutes; `docker compose logs -f erpnext-seed`).
# ERPNext wants ~2 GB of RAM more.
# Production stack lives in docker-compose.prod.yml

name: finance-acc

include:
  - ops/erpnext/docker-compose.yml

# Dev-only: the local ERPNext's API user is given this key/secret by its seed, and the app
# connects with it (local demo data only; never a real ERPNext)
x-erpnext-api: &erpnext-api
  ERPNEXT_URL: http://host.docker.internal:${ERPNEXT_PORT:-8090}
  ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-b60582c2633e4f6}
  ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-db33a50acdce153}
  ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-finance}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
  POSTGRES_DB: ${POSTGRES_DB:-finance_acc}

services:
  db:
    # Postgres 16 + pgvector extension (same image in dev, CI and prod)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment: *db-env
    ports:
      # host 5434 by default: 5432/5433 are commonly taken by a local Postgres or other projects
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: schema to head + agent catalog sync, so a fresh pull never runs on a stale DB;
  # then the Finance Admin and the Finance POD team (get-or-create: existing users untouched)
  migrate:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: dev
    restart: "no"
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && python -m src.app.cli.sync_agents &&
        python -m src.app.cli.seed --finance-team --no-demo-user
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      # the demo users' password unless .env sets one (dev only: seed refuses production)
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-FinanceDemo!2026}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance_acc}
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      db:
        condition: service_healthy

  # One-off, in the background: waits for the local ERPNext, seeds its demo company (safe to
  # rerun: what exists is skipped), then connects the app to it and takes a first snapshot
  erpnext-seed:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: dev
    restart: "no"
    command:
      - sh
      - -c
      - >-
        python scripts/erpnext_seed.py --wait 1800 &&
        python -m src.app.cli.seed --erpnext --no-demo-user
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *erpnext-api
      ENVIRONMENT: development
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-FinanceDemo!2026}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance_acc}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      migrate:
        condition: service_completed_successfully
      erpnext-frontend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: dev
    restart: unless-stopped
    # host.docker.internal (the local ERPNext on :8090) also resolves on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      # Set DOCKER_FILE_POLLING=true if hot reload misses changes (Windows / some macOS setups)
      WATCHFILES_FORCE_POLLING: ${DOCKER_FILE_POLLING:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance_acc}
    ports:
      - "${BACKEND_PORT:-8088}:8088"
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (AI explanations, QuickBooks write-back). Restarts on code changes.
  worker:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["watchfiles", "--filter", "python", "python -m src.app.cli.worker", "src/app"]
    # host.docker.internal (the local ERPNext on :8090) also resolves on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      WATCHFILES_FORCE_POLLING: ${DOCKER_FILE_POLLING:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance_acc}
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./src/frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8088
      VITE_USE_POLLING: ${DOCKER_FILE_POLLING:-false}
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    volumes:
      - ./src/frontend:/app
      # keep the container's node_modules (linux binaries), not the host's
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
